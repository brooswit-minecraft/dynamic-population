name: Release

# Path-gated: a push to main that touches version.txt — the single
# source of truth for the shipped version (see build.gradle) — publishes.
# Every other push to main (docs, CI tweaks, workflow edits, a source change
# that hasn't been version-bumped yet) runs CI but does not cut a release.
# This mirrors dynamic-atmosphere's release.yml, which gates on the same
# file for the same reason: a version bump is the deliberate "ship this"
# signal, not "any code changed".
#
# workflow_dispatch additionally accepts an explicit `version`/`notes`
# pair, for a reviewed release whose version.txt/CHANGELOG.md haven't
# been consolidated (release-gate v1 only gates branches; it has no
# merge-time version/changelog assignment of its own -- see
# scripts/release_publish.py's module docstring). Leave both blank to
# fall back to version.txt/CHANGELOG.md, the push-trigger behaviour.
on:
  push:
    branches: [main]
    paths: [version.txt]
  workflow_dispatch:
    inputs:
      version:
        description: >
          Explicit release version (e.g. 0.2.0-alpha.1), for a reviewed
          release whose version.txt/CHANGELOG.md haven't been
          consolidated yet (release-gate v1 is gate-only and never
          assigns one -- see
          https://github.com/brooswit-factory/release-gate/blob/v1/README.md).
          Leave blank to fall back to version.txt, the push-trigger
          behaviour.
        required: false
      notes:
        description: >
          Explicit, complete release notes for `version` above. Leave
          blank to fall back to CHANGELOG.md's top entry.
        required: false

# Least privilege: only the `release` job needs contents:write, to create
# the GitHub Release and upload its asset, via the automatic GITHUB_TOKEN.
# This repo has no Actions secrets or variables (verified against
# `gh api repos/brooswit-minecraft/dynamic-population/actions/secrets` ->
# total_count 0) and this workflow does not need any — no Modrinth
# publishing is wired here.
permissions:
  contents: write

concurrency:
  group: dynamic-population-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate dispatch inputs
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          DISPATCH_NOTES: ${{ github.event.inputs.notes }}
        run: python3 scripts/release_publish.py validate-dispatch-pair "$DISPATCH_VERSION" "$DISPATCH_NOTES"

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          value=$(python3 scripts/release_publish.py resolve-version "$DISPATCH_VERSION" version.txt)
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Resolve notes
        env:
          DISPATCH_NOTES: ${{ github.event.inputs.notes }}
        run: |
          # A file, not $GITHUB_OUTPUT: release notes are multi-line and may
          # contain characters $GITHUB_OUTPUT's delimiter escaping can't be
          # trusted to round-trip safely.
          printf '%s' "$DISPATCH_NOTES" > /tmp/dispatch-notes.md
          python3 scripts/release_publish.py resolve-notes /tmp/dispatch-notes.md CHANGELOG.md > notes.md

      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./gradlew build --no-daemon "-Pmod_version=$VERSION"

      - name: Verify production server boots with the mod installed
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/smoke-server.py "build/libs/dynamicpopulation-$VERSION.jar"

      - name: Verify jar/tag/version agreement
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/release_publish.py check-jar-version "build/libs/dynamicpopulation-$VERSION.jar" "$VERSION"

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          jar="build/libs/dynamicpopulation-$VERSION.jar"
          test -f "$jar"
          python3 scripts/release_publish.py publish "v$VERSION" "$GITHUB_SHA" "$jar" notes.md
