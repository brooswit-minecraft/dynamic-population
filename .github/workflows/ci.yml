name: CI

# Build on every PR and on every push to main, mirroring the trigger shape
# used by brooswit-minecraft/dynamic-atmosphere's ci.yml.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo and uploads a build
# artifact, so it never needs anything wider than read access to contents.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Verify a dedicated server boots with the mod installed
        run: python3 scripts/smoke-server.py "build/libs/dynamicpopulation-$(cat version.txt).jar"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-population
          path: build/libs/*.jar
          if-no-files-found: error
