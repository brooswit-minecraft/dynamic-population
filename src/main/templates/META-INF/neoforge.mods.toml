modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="brooswit"
description='''Dynamic Population V1 (Fillagers): a persistent, cell-based target-density population field for NeoForge 1.21.1. Reconciles lightweight background villagers ("Fillagers") toward a live-configurable target density per cell, driven by village activity (trading, breeding, building, farming, golem creation) and unsafe-location deaths, with an emerald promotion economy to convert a Fillager into a normal villager. See the Villager King mechanism for cell-field seeding.'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
